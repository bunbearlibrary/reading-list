<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YJlib</title>
<style>
  :root{
    --bg:#fff7ee; --card:#ffffff; --ink:#5c4033; --soft:#a5826a;
    --brown:#c08552; --pink:#f7a8b8; --pink-deep:#ef7d9a; --line:#f3e3d3;
    --green:#7fb685; --green-bg:#e8f5ea; --orange:#e8a04c; --orange-bg:#fdf0dd;
    --purple:#b48ec9; --purple-bg:#f3ebf9; --gray:#9a928a; --gray-bg:#f0ede9;
  }
  body.night{
    --bg:#211b16; --card:#2e2620; --ink:#e9dcd0; --soft:#b39a86; --line:#453a30;
    --green-bg:#26372a; --orange-bg:#3d3020; --purple-bg:#352b3d; --gray-bg:#35302a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    transition:background .3s; }
  .deco{ position:fixed; font-size:34px; opacity:.5; pointer-events:none; z-index:0;
    animation:float 5s ease-in-out infinite; }
  .deco.d1{ top:12%; left:6%; } .deco.d2{ top:22%; right:8%; animation-delay:1.2s; }
  .deco.d3{ bottom:14%; left:10%; animation-delay:2s; } .deco.d4{ bottom:20%; right:6%; animation-delay:.6s; }
  @keyframes float{ 0%,100%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-14px) rotate(6deg);} }
  .wrap{ position:relative; z-index:1; max-width:720px; margin:0 auto; padding:24px 16px 60px; }
  header{ text-align:center; padding:28px 0 20px; }
  header h1{ font-size:32px; letter-spacing:2px; }
  header p{ margin-top:8px; color:var(--soft); font-size:15px; letter-spacing:1px; }
  header p.upd{ margin-top:4px; font-size:12px; opacity:.85; }
  .festivalHero{ display:block; width:min(300px,72vw); margin:0 auto 6px; }
  .banner{ display:flex; gap:8px; align-items:flex-start; background:#fdeef2; color:var(--pink-deep);
    border:1px dashed var(--pink); border-radius:14px; padding:10px 16px; font-size:14px;
    line-height:1.7; margin:0 0 8px; }
  body.night .banner{ background:#43302f; }
  .banner .ic{ flex:none; font-size:15px; margin-top:4px; }
  .banner span{ flex:1; }
  .bannerClose{ flex:none; border:none; background:none; color:inherit; cursor:pointer;
    font-size:13px; opacity:.65; padding:2px 0 0 6px; font-family:inherit; }
  .bannerClose:hover{ opacity:1; }
  .toolbar{ display:flex; gap:10px; margin:14px 0 6px; }
  .searchWrap{ position:relative; flex:1; display:flex; }
  .sic{ position:absolute; left:15px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; color:var(--soft); pointer-events:none;
    fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #search{ flex:1; padding:12px 18px 12px 42px; border-radius:999px; border:2px solid var(--line);
    background:var(--card); color:var(--ink); font-size:15px; outline:none; transition:border-color .2s; }
  #search:focus{ border-color:var(--pink); }
  #search:focus + .sic, .searchWrap:focus-within .sic{ color:var(--pink); }
  .ic{ width:1.05em; height:1.05em; vertical-align:-.16em; fill:none;
    stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #nightBtn{ border:2px solid var(--line); background:var(--card); border-radius:999px;
    width:46px; font-size:18px; cursor:pointer; }
  .statline{ display:flex; align-items:center; gap:8px; padding:4px 8px 12px; }
  .stats{ flex:1; color:var(--soft); font-size:13px; }
  .sortbar{ display:flex; gap:6px; }
  .sbtn{ border:2px solid var(--line); background:var(--card); color:var(--soft);
    border-radius:999px; padding:4px 12px; font-size:12px; cursor:pointer; font-family:inherit;
    display:inline-flex; align-items:center; gap:4px; }
  .sbtn.on{ border-color:var(--pink); color:var(--pink-deep); background:#fdeef2; }
  body.night .sbtn.on{ background:#43302f; }
  .bd{ display:inline-block; font-size:12px; border-radius:999px; padding:2px 10px; margin:0 6px 4px 0; }
  .bd-cp{ background:#fdeef2; color:var(--pink-deep); }
  .bd-ok{ background:var(--green-bg); color:var(--green); }
  .bd-ing{ background:var(--orange-bg); color:var(--orange); }
  .bd-ex{ background:var(--purple-bg); color:var(--purple); }
  .bd-todo{ background:var(--gray-bg); color:var(--gray); }
  body.night .bd-cp{ background:#43302f; }
  .tag{ display:inline-block; background:#fdeef2; color:var(--pink-deep); font-size:12px;
    border-radius:999px; padding:2px 10px; margin:0 6px 4px 0; cursor:pointer; border:none; font-family:inherit; }
  body.night .tag{ background:#43302f; }
  .tag:active{ transform:scale(.94); }
  .book{ position:relative; display:block; width:100%; text-align:left; background:var(--card);
    border:1px solid var(--line); border-radius:18px; padding:16px 18px 14px; margin-bottom:12px;
    cursor:pointer; box-shadow:0 3px 10px rgba(140,95,55,.08); transition:transform .15s; color:var(--ink); }
  .book:active{ transform:scale(.98); }
  .book .title{ font-size:17px; font-weight:600; line-height:1.5; margin:2px 90px 4px 0; }
  .book .author{ font-size:13px; color:var(--soft); margin-bottom:6px; }
  .book .meta{ font-size:12px; color:var(--soft); margin-top:8px; }
  .dl{ position:absolute; right:14px; bottom:12px; display:inline-block; text-decoration:none;
    background:var(--pink); color:#fff; font-size:13px; border-radius:999px; padding:6px 14px;
    box-shadow:0 2px 6px rgba(239,125,154,.35); }
  .dl:active{ transform:scale(.94); }
  .dl2{ display:inline-block; text-decoration:none; background:var(--pink); color:#fff;
    font-size:14px; border-radius:999px; padding:8px 18px; margin:4px 8px 0 0;
    box-shadow:0 2px 6px rgba(239,125,154,.35); }
  .rel{ background:var(--card); border:1px dashed var(--line); border-radius:14px;
    padding:10px 14px; font-size:14px; margin-top:10px; }
  .rel a{ color:var(--pink-deep); font-weight:600; }
  .center{ text-align:center; color:var(--soft); padding:60px 0; font-size:15px; line-height:2; }
  .moreWrap{ text-align:center; padding:6px 0 30px; }
  .readerBar{ position:sticky; top:0; z-index:5; display:flex; gap:8px; align-items:center;
    background:var(--bg); padding:10px 0; border-bottom:1px dashed var(--line); }
  .rbtn{ border:2px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:999px; padding:8px 14px; font-size:14px; cursor:pointer;
    display:inline-flex; align-items:center; gap:5px; }
  .readerTitle{ font-size:22px; font-weight:700; margin:22px 0 6px; line-height:1.6; }
  .readerMeta{ color:var(--soft); font-size:13px; margin-bottom:6px; }
  #content{ font-size:18px; line-height:2; letter-spacing:.3px; margin-top:14px; }
  #content p{ margin-bottom:1em; text-indent:2em; }
  #content p.blank{ height:.5em; margin-bottom:0; text-indent:0; }
  #readMore{ text-align:center; padding:10px 0 6px; }
  #readMore .prog{ font-size:12px; color:var(--soft); margin-top:8px; }
  .backTop{ text-align:center; margin-top:40px; }
/* 回到顶部 / 回到底部 按钮 */
.floatBtns{ position:fixed; right:14px; bottom:20px; z-index:50; display:flex; flex-direction:column; gap:10px; }
.floatBtn{ width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
  box-shadow:0 3px 12px rgba(140,95,55,.2); transition:transform .15s, opacity .2s;
  display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; opacity:0.5;}
.floatBtn.topBtn{ background:var(--orange); }
.floatBtn.bottomBtn{ background:var(--green); }
.floatBtn.diceBtn{ background:var(--pink-deep); }
.floatBtn:hover{ opacity:.85; }
.floatBtn:active{ transform:scale(.92); }
.floatBtn.diceBtn.rolling{ animation:diceSpin .45s linear infinite; opacity:.95; }
@keyframes diceSpin{ 0%{transform:rotate(0) scale(1);} 50%{transform:rotate(180deg) scale(1.18);} 100%{transform:rotate(360deg) scale(1);} }
/* 随机推荐弹窗 */
.rollMask{ position:fixed; inset:0; z-index:99; background:rgba(60,40,30,.45);
  display:flex; align-items:center; justify-content:center; padding:20px; }
.rollCard{ position:relative; background:var(--card); border:1px solid var(--line);
  border-radius:20px; max-width:420px; width:100%; padding:24px 20px 18px; text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.25); animation:popIn .25s ease; }
@keyframes popIn{ 0%{transform:scale(.7); opacity:0;} 60%{transform:scale(1.05); opacity:1;} 100%{transform:scale(1); opacity:1;} }
.rollClose{ position:absolute; top:10px; right:12px; border:none; background:none;
  color:var(--soft); font-size:16px; cursor:pointer; }
.rollCard .rollDice{ font-size:17px; font-weight:800; letter-spacing:2px; margin-bottom:8px; }
.rollCard .rollDice .gt{
  background:linear-gradient(90deg,var(--pink-deep),var(--orange),var(--purple));
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.rollNote{ display:table; margin:10px auto 0; font-size:13px; font-weight:600; color:var(--pink-deep);
  background:#fdeef2; border-radius:12px; padding:6px 12px; }
body.night .rollNote{ background:#43302f; }
.rollNote.devil{ color:#fff; background:var(--purple); }
body.night .rollNote.devil{ background:#7a5c96; }
#rollBody.settle{ animation:settle .38s cubic-bezier(.34,1.56,.64,1); }
@keyframes settle{ 0%{transform:scale(.55); opacity:0;} 100%{transform:scale(1); opacity:1;} }
#confettiCv{ position:fixed; inset:0; width:100vw; height:100vh; z-index:200;
  pointer-events:none; display:none; }
.rollCard .rt{ font-size:19px; font-weight:700; margin:8px 0 4px; line-height:1.6; }
.rollCard .ra{ color:var(--soft); font-size:13px; margin-bottom:6px; }
.rollCard .rmeta2{ color:var(--soft); font-size:12px; margin-top:8px; }
.rollCard .rbtns{ margin-top:16px; display:flex; gap:10px; justify-content:center; }
.rollCard .dl2{ border:none; cursor:pointer; font-family:inherit; margin:0; }
</style>

function decodeBuf(buf){
  const b = new Uint8Array(buf);
  if(b[0]===0xFF && b[1]===0xFE) return new TextDecoder("utf-16le").decode(b.subarray(2));
  if(b[0]===0xFE && b[1]===0xFF) return new TextDecoder("utf-16be").decode(b.subarray(2));
  if(b[0]===0xEF && b[1]===0xBB && b[2]===0xBF) return new TextDecoder("utf-8").decode(b.subarray(3));
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder("gb18030").decode(buf); }
}

/* 把 2026-07-20 / 2026/7/20 / 2026年7月20日 都统一成 2026-07-20 */
function normDate(s){
  const m = String(s||"").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(!m) return "";
  return m[1] + "-" + m[2].padStart(2,"0") + "-" + m[3].padStart(2,"0");
}

function parseCSV(text){
  const meta = {};
  text.replace(/\r\n?/g,"\n").split("\n").slice(1).forEach(line=>{
    if(!line.trim()) return;
    const c = line.split(",").map(s=>s.trim());
    if(!c[0]) return;
    meta[c[0]] = {
      title: c[1]||"", author: c[2]||"", status: c[3]||"",
      parent: c[4]||"", tags: (c[5]||"").split("、").map(s=>s.trim()).filter(Boolean),
      date: normDate(c[6])
    };
  });
  return meta;
}

  if(sortMode === "date"){
    BOOKS.sort((a,b)=>{
      const da = a.m && a.m.date, db = b.m && b.m.date;
      if(da && db) return db.localeCompare(da);
      if(da) return -1;
      if(db) return 1;
      return a.name.localeCompare(b.name,"zh");
    });
  }else{
    BOOKS.sort((a,b)=>{
      const ka=(a.m&&a.m.parent)||a.name, kb=(b.m&&b.m.parent)||b.name;
      if(ka!==kb) return ka.localeCompare(kb,"zh");
      const ea=(a.m&&a.m.parent)?1:0, eb=(b.m&&b.m.parent)?1:0;
      return ea-eb || a.name.localeCompare(b.name,"zh");
    });
  }
}

function setSort(mode){
  sortMode = mode;
  localStorage.setItem("bbsort", mode);
  shownCount = PAGE_SIZE;
  sortBooks();
  paintSortBtns();
  renderList();
}
function paintSortBtns(){
  $("sortDateBtn").classList.toggle("on", sortMode==="date");
  $("sortNameBtn").classList.toggle("on", sortMode==="name");
}

async function loadAll(){
  try{
    const [listR, csvR, bnR] = await Promise.all([
      fetch(`https://api.github.com/repos/${REPO}/contents?ref=${BRANCH}`),
      fetch("./00-books.csv?t=" + Date.now()),
      fetch("./00-banner.txt?t=" + Date.now())   /* 顶部横幅：文件存在且有内容才显示 */
    ]);
    if(!listR.ok) throw new Error("api");
    const items = await listR.json();
    const META = csvR.ok ? parseCSV(decodeBuf(await csvR.arrayBuffer())) : {};
    if(bnR.ok){
      const txt = decodeBuf(await bnR.arrayBuffer()).trim();
      /* 关过的旧横幅不再烦人；换了新内容会重新显示 */
      if(txt && txt !== localStorage.getItem("bbbanner_off")){
        BANNER_TXT = txt;
        $("bannerTxt").innerHTML = esc(txt).replace(/\n/g,"<br>");
        $("banner").style.display = "";
      }
    }
    BOOKS = items.filter(i => i.type==="file" && /\.txt$/i.test(i.name) && i.name !== "00-banner.txt")
                 .map(i => ({ name:i.name, size:i.size, m:META[i.name]||null }));
    const dates = BOOKS.map(b=>b.m&&b.m.date).filter(Boolean);
    if(dates.length){
      $("lastUpd").textContent = "最后更新 " + dates.sort().slice(-1)[0].replace(/-/g,"/");
      $("lastUpd").style.display = "";
      $("sortBar").style.display = "";
    }
    sortBooks();
    NAME2BOOK = Object.fromEntries(BOOKS.map(b=>[b.name,b]));
    paintSortBtns();
    renderList(); route();
  }catch(e){
    $("stats").innerHTML = "😢 书架暂时打不开（可能是请求太频繁）<br>稍等一分钟刷新试试～";
  }
}

function parseName(name){
  const base = name.replace(/\.txt$/i,"");
  const tags = []; let t = base, m;
  const re = /^(\[[^\]]+\]|【[^】]+】)\s*/;
  while((m = t.match(re))){ tags.push(m[1].slice(1,-1)); t = t.slice(m[0].length); }
  return { title: t.trim() || base, tags };
}

function titleOf(b){ return (b.m && b.m.title) || parseName(b.name).title; }
function cpTags(b){ return parseName(b.name).tags; }

function statusBadge(m){
  if(!m || !m.status) return "";
  const cls = m.status.includes("连载")||m.status.includes("未完结") ? "bd-ing" : "bd-ok";
  return `<span class="bd ${cls}">${esc(m.status)}</span>`;
}
function badgesOf(b){
  let s = cpTags(b).map(t=>`<span class="bd bd-cp">${esc(t)}</span>`).join("");
  s += statusBadge(b.m);
  if(b.m && b.m.parent) s += `<span class="bd bd-ex">番外</span>`;
  if(!b.m) s += `<span class="bd bd-todo">${IC_PEN} 待编目</span>`;
  return s;
}
function typeTagsOf(b){
  if(!b.m || !b.m.tags.length) return "";
  return `<div>${b.m.tags.map(t=>
    `<button class="tag" onclick="event.stopPropagation();searchTag('${esc(t)}')">${esc(t)}</button>`).join("")}
  </div>`;
}

function renderList(){
  const kw = $("search").value.trim().toLowerCase();
  const hit = b => !kw || [b.name, titleOf(b), b.m?b.m.author:"", b.m?b.m.status:"", (b.m?b.m.tags:[]).join("、")]
                     .join(" ").toLowerCase().includes(kw);
  const shown = BOOKS.filter(hit);
  const page = shown.slice(0, shownCount);
  const todo = BOOKS.filter(b=>!b.m).length;
  $("stats").innerHTML = `${IC_BOOK} 馆藏 ${BOOKS.length} 篇`
    + (todo ? ` · ${IC_PEN} ${todo} 篇待编目` : "")
    + (kw ? ` · 搜到 ${shown.length} 篇` : "");
  $("list").innerHTML = page.map(b=>{
    const kb = (b.size/1024).toFixed(0);
    return `<div class="book" onclick="goRead('${encodeURIComponent(b.name)}')">
      <div>${badgesOf(b)}</div>
      <div class="title">${esc(titleOf(b))}</div>
      ${b.m&&b.m.author?`<div class="author">作者：${esc(b.m.author)}</div>`:""}
      ${typeTagsOf(b)}
      <div class="meta">约 ${(kb/1.4).toFixed(0)} 千字 · ${kb} KB</div>
      <a class="dl" href="./${encodeURIComponent(b.name)}" download
         onclick="event.stopPropagation();trackDL('${esc(b.name)}')">下载</a>
    </div>`;
  }).join("") || `<div class="center">🕳️ 书架空空如也<br>（或者没搜到呀）</div>`;
  const remain = shown.length - page.length;
  $("moreWrap").style.display = remain > 0 ? "" : "none";
  if(remain > 0) $("moreStats").textContent = `还有 ${remain} 篇`;
}
function moreBooks(){
  shownCount += PAGE_SIZE;
  renderList();
}

function searchTag(t){
  closeRoll();
  goList();
  $("search").value = t;
  shownCount = PAGE_SIZE;
  renderList();
}

async function goRead(enc){ location.hash = "#/read/" + enc; }

/* ====== 🎲 随机推荐 ====== */
let rolling = false;
function rollPool(){
  const cat = BOOKS.filter(b=>b.m);   /* 只抽已编目的 */
  return cat.length ? cat : BOOKS;
}
function pickOne(){
  const pool = rollPool();
  let recent = [];
  try{ recent = JSON.parse(localStorage.getItem("bbrecent")||"[]"); }catch(e){}
  let cand = pool.filter(b=>!recent.includes(b.name));
  if(!cand.length){ recent = []; cand = pool; }   /* 全抽过一轮就重置 */
  const b = cand[Math.floor(Math.random()*cand.length)];
  const cap = Math.max(1, Math.min(10, pool.length-1));  /* 记住最近10篇不重复 */
  recent.push(b.name);
  while(recent.length > cap) recent.shift();
  try{ localStorage.setItem("bbrecent", JSON.stringify(recent)); }catch(e){}
  return b;
}
let rollStreak = 0;        /* 连抽未读计数：点「就这本了」才清零 */
let lastRollAuthor = null; /* 上一抽的作者，用于有缘彩蛋 */
function rollCardHTML(b, sameAuthor, streak){
  const kb = (b.size/1024).toFixed(0);
  let note = "";
  if(sameAuthor) note += `<div class="rollNote">💞 又是这位太太，你们今天很有缘！</div>`;
  if(streak >= 10){
    const lvl = streak >= 30 ? 4 : streak >= 20 ? 3 : streak >= 15 ? 2 : 1;
    const msg = lvl === 4 ? "随便你啦！"
              : lvl === 3 ? "都要抽出火星子了！！快去看文！"
              : lvl === 2 ? "说了不要再抽了！！"
              : "不要再抽了！";
    const emo = lvl === 4 ? "🫠🫠🫠🫠" : "😈".repeat(lvl);
    note += `<div class="rollNote devil">${emo} ${msg}</div>`;
  }
  return `<div class="rollDice">🎲 <span class="gt">同人抽抽乐</span> 🎲</div>
    <div>${badgesOf(b)}</div>
    <div class="rt">${esc(titleOf(b))}</div>
    ${b.m&&b.m.author?`<div class="ra">作者：${esc(b.m.author)}</div>`:""}
    ${typeTagsOf(b)}
    <div class="rmeta2">约 ${(kb/1.4).toFixed(0)} 千字 · ${kb} KB</div>
    ${note}
    <div class="rbtns">
      <button class="dl2" onclick="rollGo('${encodeURIComponent(b.name)}')">就这本了</button>
      <button class="rbtn" onclick="rollAgain()">再抽一次</button>
    </div>`;
}
/* 彩带庆祝 */
function confettiBurst(){
  const cv = $("confettiCv"), ctx = cv.getContext("2d");
  const W = innerWidth || document.documentElement.clientWidth || 800;
  const H = innerHeight || document.documentElement.clientHeight || 600;
  cv.width = W; cv.height = H;
  cv.style.display = "block";
  const colors = ["#ef7d9a","#f7a8b8","#e8a04c","#7fb685","#b48ec9","#c08552"];
  const parts = [];
  const cx = W/2, cy = H*0.42;
  for(let i=0;i<130;i++){
    const a = Math.random()*Math.PI*2, v = 4+Math.random()*9;
    parts.push({ x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v-5,
      s:4+Math.random()*5, c:colors[i%colors.length],
      r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
      circle:Math.random()<.4, life:1 });
  }
  let t0 = performance.now();
  requestAnimationFrame(function tick(t){
    const dt = Math.min(3, (t-t0)/16.7); t0 = t;
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = false;
    for(const p of parts){
      p.vy += .16*dt; p.vx *= .995; p.x += p.vx*dt; p.y += p.vy*dt;
      p.r += p.vr*dt; p.life -= .011*dt;
      if(p.life<=0 || p.y>cv.height+24) continue;
      alive = true;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      if(p.circle){ ctx.beginPath(); ctx.arc(0,0,p.s/2.4,0,7); ctx.fill(); }
      else ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
      ctx.restore();
    }
    if(alive) requestAnimationFrame(tick);
    else{ ctx.clearRect(0,0,cv.width,cv.height); cv.style.display = "none"; }
  });
}

function openRoll(){
  if(rolling || !BOOKS.length) return;
  rolling = true;
  $("rollMask").style.display = "flex";
  $("diceBtn").classList.add("rolling");
  const body = $("rollBody");
  body.classList.remove("settle");
  const pool = rollPool();
  const shuffle = setInterval(()=>{   /* 洗牌动画：标题飞速轮换 */
    const b = pool[Math.floor(Math.random()*pool.length)];
    body.innerHTML = `<div class="center" style="padding:34px 0">🎲<br>${esc(titleOf(b))}</div>`;
  }, 90);
  setTimeout(()=>{
    clearInterval(shuffle);
    const b = pickOne();
    const same = !!(b.m && b.m.author && b.m.author === lastRollAuthor);
    lastRollAuthor = (b.m && b.m.author) || null;
    rollStreak++;
    body.innerHTML = rollCardHTML(b, same, rollStreak);
    body.classList.add("settle");
    confettiBurst();   /* 抽中！彩带庆祝 */
    $("diceBtn").classList.remove("rolling");
    rolling = false;
  }, 900);
}
function rollAgain(){ if(!rolling) openRoll(); }
function rollGo(enc){ rollStreak = 0; closeRoll(); goRead(enc); }
function closeRoll(){ $("rollMask").style.display = "none"; }
/* ==================== */

/* 正文分页渲染：保留原文所有换行和空行 */
function renderNextChunk(){
  let html = "", c = 0;
  while(READ.pi < READ.paras.length && (c < CHUNK_CHARS || c === 0)){
    const line = READ.paras[READ.pi++];
    c += line.length;
    html += line.trim() ? `<p>${esc(line.trim())}</p>` : `<p class="blank"></p>`;
  }
  READ.chars += c;
  $("content").insertAdjacentHTML("beforeend", html);
  const more = READ.pi < READ.paras.length;
  $("readMore").style.display = more ? "" : "none";
  $("readProg").textContent = more
    ? `已加载 ${Math.min(99, Math.round(READ.chars / READ.totalChars * 100))}%`
    : "";
  if(!more && READ.totalChars > CHUNK_CHARS)
    $("content").insertAdjacentHTML("beforeend", `<div class="center" style="padding:30px 0">—— 🐻 全文完 🐰 ——</div>`);
}

async function showReader(enc){
  const name = decodeURIComponent(enc);
  const b = NAME2BOOK[name] || { name, size:0, m:null };
  $("listView").style.display="none";
  $("readView").style.display="block";
  window.scrollTo(0,0);
  $("rTitle").textContent = titleOf(b);
  let meta = [];
  if(b.m && b.m.author) meta.push("作者：" + esc(b.m.author));
  if(b.size) meta.push("约 " + (b.size/1024/1.4).toFixed(0) + " 千字");
  $("rMeta").innerHTML = meta.join(" · ");
  $("rTags").innerHTML = badgesOf(b) + typeTagsOf(b)
    + ` <a class="dl2" href="./${encodeURIComponent(name)}" download onclick="trackDL('${esc(name)}')">下载 TXT</a>`;
  let rel = "";
  if(b.m && b.m.parent){
    const p = NAME2BOOK[b.m.parent];
    rel += p
      ? `<div class="rel">${IC_CLIP} 本篇为番外，正文：<a target="_self" href="#/read/${encodeURIComponent(p.name)}">《${esc(titleOf(p))}》</a></div>`
      : `<div class="rel">${IC_LINK} 正文《${esc(b.m.parent)}》未找到，请检查 books.csv 里的文件名是否一字不差</div>`;
  }
  const kids = BOOKS.filter(x => x.m && x.m.parent === name);
  if(kids.length){
    rel += `<div class="rel">${IC_PUZZLE} 本篇有番外：` + kids.map(k=>
      `<a target="_self" href="#/read/${encodeURIComponent(k.name)}">《${esc(titleOf(k))}》</a>`).join("、") + `</div>`;
  }
  $("rRel").innerHTML = rel;
  $("content").innerHTML = `<div class="center">🐻🐰 正在搬文…</div>`;
  $("readMore").style.display = "none";
  try{
    let buf;
    try{
      const r = await fetch("./" + encodeURIComponent(name));
      if(!r.ok) throw new Error();
      buf = await r.arrayBuffer();
    }catch(e){
      const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(name)}?ref=${BRANCH}`);
      const j = await r.json();
      const bin = atob(j.content.replace(/\s/g,""));
      buf = Uint8Array.from(bin, c=>c.charCodeAt(0));
    }
    const text = decodeBuf(buf).replace(/\r\n?/g,"\n");
    READ.paras = text.split("\n");
    READ.pi = 0; READ.chars = 0;
    READ.totalChars = READ.paras.reduce((s,l)=>s+l.length, 0);
    trackRead(name);
    $("content").innerHTML = "";
    renderNextChunk();
  }catch(e){
    $("content").innerHTML = `<div class="center">😢 这篇搬运失败了，刷新试试？</div>`;
  }
}
function goList(){ location.hash = ""; }
function route(){
  const m = location.hash.match(/^#\/read\/(.+)$/);
  if(m && NAME2BOOK[decodeURIComponent(m[1])]){ showReader(m[1]); }
  else{ $("readView").style.display="none"; $("listView").style.display="block"; }
}

/* 下载/阅读统计上报 */
function trackDL(name){
  try{ if(window.goatcounter && goatcounter.count)
    goatcounter.count({ path: "/下载/" + name, title: "下载 " + name, event: true });
  }catch(e){}
}
function trackRead(name){
  try{ if(window.goatcounter && goatcounter.count)
    goatcounter.count({ path: "/阅读/" + name, title: "阅读 " + name, event: true });
  }catch(e){}
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let fs = +(localStorage.getItem("bbfs")||18);
function fontStep(d){ fs=Math.min(26,Math.max(14,fs+d)); localStorage.setItem("bbfs",fs); $("content").style.fontSize=fs+"px"; }
function applyNight(){
  const on = localStorage.getItem("bbnight")==="1";
  document.body.classList.toggle("night",on);
  $("nightBtn").textContent = on ? "☀️" : "🌙";
}
$("nightBtn").onclick = ()=>{ localStorage.setItem("bbnight", document.body.classList.contains("night")?"0":"1"); applyNight(); };
$("search").addEventListener("input", ()=>{ shownCount = PAGE_SIZE; renderList(); });
window.addEventListener("hashchange", route);

/* ====== 🎑 中秋限定头图 ======
 * 中秋假期（2026-09-25 ~ 09-27）显示，2026-09-28 00:00（北京时间）起自动隐藏，无需再改动。
 * 节后想彻底移除：删掉这段代码和 header 里的 <img id="festivalHero"> 即可（图为内联 base64，无额外文件）。 */
if(Date.now() < +new Date("2026-09-28T00:00:00+08:00")){
  const fh = $("festivalHero");
  if(fh) fh.style.display = "";
}

applyNight();
$("content").style.fontSize = fs+"px";
loadAll();
</script>
